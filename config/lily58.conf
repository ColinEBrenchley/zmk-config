# Encoder
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# USB & BLE
CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y

CONFIG_ZMK_STUDIO=y

# BLE - these are important for reliability
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_ZMK_BLE_EXPERIMENTAL_SEC=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

CONFIG_ZMK_SETTINGS_RESET_ON_START=y


# Battery reporting (nice!nano has a battery)
# CONFIG_ZMK_BATTERY_REPORTING=y

# Sleep behavior
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=0
# CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
# CONFIG_GPIO_AS_PINRESET=n

# Uncomment to enable OLED
# CONFIG_ZMK_DISPLAY=y

# Uncomment to enable RGB underglow
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y