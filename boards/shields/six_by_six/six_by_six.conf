# USB & BLE
CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y

# Studio & Physical Layout
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_PHYSICAL_LAYOUT_KEY_ROTATION=y

# BLE - these are important for reliability
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_ZMK_BLE_EXPERIMENTAL_SEC=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

CONFIG_ZMK_SETTINGS_RESET_ON_START=y

# Sleep behavior
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=0
