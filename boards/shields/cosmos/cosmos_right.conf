# Cosmos Keyboard — Right Half Config
CONFIG_ZMK_KEYBOARD_NAME="Cosmos"

# Split keyboard — peripheral
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_BLE=y

# BLE
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Cosmos Right"
CONFIG_ZMK_BLE=y

# Battery reporting
CONFIG_ZMK_BATTERY_REPORTING=y

# Power management
CONFIG_ZMK_SLEEP=y

# No USB on peripheral
CONFIG_USB_DEVICE_STACK=n
CONFIG_ZMK_USB=n

# Logging off
CONFIG_ZMK_USB_LOGGING=n
