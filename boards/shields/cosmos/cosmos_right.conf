# Cosmos Keyboard — Right Half Config
CONFIG_ZMK_KEYBOARD_NAME="Cosmos"

# Split keyboard — peripheral
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_BLE=y

# BLE
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Cosmos Right"
CONFIG_ZMK_BLE=y

# Enable underglow (RGB LEDs)
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=0

# Enable ZMK Studio support
/* Peripheral half shouldn't enable ZMK Studio (no USB). */
CONFIG_ZMK_STUDIO=n

# Battery reporting
CONFIG_ZMK_BATTERY_REPORTING=y

# Power management
CONFIG_ZMK_SLEEP=y

# No USB on peripheral
CONFIG_USB_DEVICE_STACK=n
CONFIG_ZMK_USB=n

## Logging 
#CONFIG_LOG=y
#CONFIG_LOG_DEFAULT_LEVEL=3
#CONFIG_ZMK_USB_LOGGING=y