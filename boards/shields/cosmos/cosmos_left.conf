# Cosmos Keyboard — Left Half Config
CONFIG_ZMK_KEYBOARD_NAME="Cosmos"

# Split keyboard — central (USB host)
CONFIG_ZMK_SPLIT=y
# CONFIG_ZMK_SPLIT_BLE=y

# BLE
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_DEVICE_NAME="Cosmos Left"
CONFIG_ZMK_BLE=y

# USB HID
CONFIG_USB_DEVICE_STACK=y
CONFIG_ZMK_USB=y

# Battery reporting (nice!nano has battery circuit)
CONFIG_ZMK_BATTERY_REPORTING=y

# Power management
CONFIG_ZMK_SLEEP=y

# Logging (disable for production to save power)
CONFIG_ZMK_USB_LOGGING=n
