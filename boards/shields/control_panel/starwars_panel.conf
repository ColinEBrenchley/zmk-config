# USB only
CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=n

# USB Raw HID for browser LED control; retain the module defaults for the
# usage page (0xFF60), usage (0x61), and 32-byte reports.
CONFIG_RAW_HID=y

# Encoders
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# WS2812B strip: the first four LEDs are an independent red light bar, and
# the remaining 12 are controlled by the regular effects in src/led_fx.c.
# ZMK's stock underglow is OFF; it cannot share ownership of this strip.
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_SPI=y
CONFIG_LED_STRIP=y
CONFIG_WS2812_STRIP=y

# Custom effects (percent brightness; max keeps current inside USB limits)
CONFIG_LED_FX=y
CONFIG_LED_FX_MAX_BRIGHTNESS=50
CONFIG_LED_FX_DEFAULT_BRIGHTNESS=30
# White-equivalent peak for one-shot flashes. Colors that use fewer than
# three channels scale up automatically. Lower this if the board resets.
CONFIG_LED_FX_FLASH_MAX_BRIGHTNESS=60

# Set to y to fire the blue-white sweep on every key press
CONFIG_LED_FX_SWEEP_ON_KEYPRESS=n
