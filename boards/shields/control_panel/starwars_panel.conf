# USB only
CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=n

# USB Raw HID for browser LED control; retain the module defaults for the
# usage page (0xFF60), usage (0x61), and 32-byte reports.
CONFIG_RAW_HID=y
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_ADC=y
CONFIG_ADC_NRFX_SAADC=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BACKEND_UART=y
CONFIG_ZMK_USB_LOGGING=y

# Encoders
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# WS2812B strip: the first four LEDs are an independent red light bar, and
# the remaining 12 are controlled by the regular effects in src/led_fx.c.
# ZMK's stock underglow is OFF; it cannot share ownership of this strip.
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_SPI=y
CONFIG_LED_STRIP=y
CONFIG_WS2812_STRIP=y

# LED power/startup/test configuration. Test mode 0 is normal operation.
CONFIG_LED_FX=y
CONFIG_LED_FX_MAX_BRIGHTNESS=30
CONFIG_LED_FX_DEFAULT_BRIGHTNESS=30
CONFIG_LED_FX_MAX_MA=250
CONFIG_LED_FX_STARTUP_DELAY_MS=500
CONFIG_LED_FX_STARTUP_RAMP_MS=1500
CONFIG_LED_FX_STARTUP_GROUP_SIZE=4
CONFIG_LED_FX_STARTUP_GROUP_INTERVAL_MS=100
CONFIG_LED_FX_TEST_MODE=0
CONFIG_LED_FX_TEST_VDD_MIN_MV=2700
CONFIG_LED_FX_VDD_REPORT_INTERVAL_MS=1000

# Set to y to fire the blue-white sweep on every key press
CONFIG_LED_FX_SWEEP_ON_KEYPRESS=n
